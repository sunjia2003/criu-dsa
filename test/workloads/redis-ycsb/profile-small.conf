# Keep the loaded dataset below 2 GiB in Redis for the small profile while
# still landing in the several-hundred-MiB to ~1-GiB class during load.
# Raw YCSB payload here is about 512 MiB: 524288 records * 10 fields * 100 bytes.
recordcount=524288
operationcount=20000
workload=site.ycsb.workloads.CoreWorkload
readallfields=true
fieldcount=10
fieldlength=100
readproportion=0.5
updateproportion=0.5
scanproportion=0
insertproportion=0
requestdistribution=zipfian
